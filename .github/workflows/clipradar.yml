name: ClipRadar
on:
  schedule:
    - cron: '0 5 * * *'   # 07:00 MESZ
  workflow_dispatch:
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r app/requirements.txt
      - name: Tests
        run: |
          pip install pytest
          python -m pytest app/tests/ -q
      - name: Run ClipRadar
        working-directory: app
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX: ${{ secrets.GOOGLE_CX }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python -m engine.runner
      - name: Commit results
        run: |
          git config user.name "ClipRadar"
          git config user.email "bot@clipradar.local"
          git add app/data/ app/output/
          git diff --staged --quiet || git commit -m "ClipRadar: neue Clippings und Reports"
          git push
