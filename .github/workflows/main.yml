name: MK Clipping Agent
on:
  # Ein Tageslauf pro Tag (Berliner Datum), Ergebnisse vor 08:30 Uhr. GitHub startet geplante Läufe
  # oft Stunden zu spät, deshalb ein früher Termin (23:17 UTC = nachts in Berlin) plus zwei Ersatztermine.
  # Die Ersatztermine laufen nur, wenn der Tageslauf für das Berliner Datum noch fehlt.
  schedule:
    - cron: '17 23 * * *'
    - cron: '13 2 * * *'
    - cron: '41 4 * * *'
  # Sofortlauf ohne Warten: Prüflisten-Entscheidungen eintragen oder die Datei .github/run-now ändern.
  push:
    branches: [main]
    paths: ['data/review_decisions.csv', '.github/run-now']
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = normaler Lauf, backfill = Zeitraum nachsuchen, enrich = Sprecher für Bestand ergänzen"
        required: false
        default: "daily"
      date_from:
        description: "Nur backfill: ab Datum (YYYY-MM-DD)"
        required: false
        default: ""
      date_to:
        description: "Nur backfill: bis Datum (YYYY-MM-DD, leer = heute)"
        required: false
        default: ""
      dry_run:
        description: "Testlauf ohne Speichern (true/false)"
        required: false
        default: "false"
permissions:
  contents: write
concurrency:
  group: clipping-agent-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  clipping-search:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX: ${{ secrets.GOOGLE_CX }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ github.event.inputs.mode || 'daily' }}
          DATE_FROM: ${{ github.event.inputs.date_from }}
          DATE_TO: ${{ github.event.inputs.date_to }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          ARGS="--mode $MODE"
          if [ -n "$DATE_FROM" ]; then ARGS="$ARGS --from $DATE_FROM"; fi
          if [ -n "$DATE_TO" ]; then ARGS="$ARGS --to $DATE_TO"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$EVENT" = "schedule" ]; then ARGS="$ARGS --scheduled"; fi
          python src/main.py $ARGS
      - name: Commit
        if: always()
        run: |
          git config user.name "MK Clipping Agent"
          git config user.email "agent@mk.com"
          git add data/ output/ docs/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Clipping-Lauf $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
      - name: Health check
        if: always()
        run: python src/runreport.py
