name: FinVoice Ghostwriting Agent
on:
  schedule:
    - cron: '0 5 * * 1'   # Montag 05:00 UTC = 06:00/07:00 Uhr DACH
  workflow_dispatch:
permissions:
  contents: write
jobs:
  weekly-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r finvoice/requirements.txt
      - name: Generate weekly drafts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python finvoice/src/main.py
      - name: Commit
        run: |
          git config user.name "FinVoice Agent"
          git config user.email "agent@finvoice.local"
          git add finvoice/data/ finvoice/docs/
          git diff --staged --quiet || git commit -m "FinVoice: Wochenentwürfe"
          git push
